<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Generator | Compose precise AI prompts</title>
    <meta
      name="description"
      content="A composing desk for educators, students, and professionals. Structure subject, task, level, and constraints into rigorous, teacher-safe AI prompts."
    />
    <meta name="theme-color" content="#0e0e11" />
    <script>
      (function () {
        var s = localStorage.getItem('pg-theme');
        var dark = s ? s === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
